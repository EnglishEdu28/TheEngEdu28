<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register • English EduLites 28</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page">
    <section class="shell" style="max-width: 520px;">
      <header class="topbar">
        <div class="topbar-left">
          <div class="appmark" aria-hidden="true">📝</div>
          <div>
            <div class="topbar-title">Create account</div>
            <div class="topbar-sub">Student registration</div>
          </div>
        </div>
        <div class="topbar-right">
          <a class="chip" href="{{ url_for('login') }}">Back to Login</a>
        </div>
      </header>

      <section class="card">
        <div class="section-title">Registration</div>
        <div class="section-sub">Enter your details to create an account.</div>

        {% if error %}
          <div class="alert alert-error" style="margin-top: 12px;">
            <strong>Registration failed</strong>
            {{ error }}
          </div>
        {% endif %}

        <form class="form" method="POST" action="{{ url_for('register') }}">
          <div class="field">
            <label>Username</label>
            <input class="input" type="text" name="username" placeholder="Choose a username" required />
            <div class="hint">At least 4 characters.</div>
          </div>

          <div class="field">
            <label>Email</label>
            <input class="input" type="email" name="email" placeholder="example@email.com" required />
          </div>

          <div class="field">
            <label>Password</label>
            <input class="input" type="password" name="password" placeholder="Create a password" required />
            <div class="hint">At least 6 characters.</div>
          </div>

          <button class="btn-primary" type="submit">Create account →</button>

          <div class="row" style="margin-top: 10px;">
            <a class="link" href="{{ url_for('login') }}">Already have an account? Login</a>
          </div>
        </form>
      </section>
    </section>

    <div class="bg-orb orb-1" aria-hidden="true"></div>
    <div class="bg-orb orb-2" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>
  </main>
</body>
</html>
