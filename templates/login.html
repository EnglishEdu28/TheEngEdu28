<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login • University Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page">
    <section class="shell" style="max-width: 520px;">
      <header class="topbar" style="margin-bottom: 12px;">
        <div class="topbar-left">
          <div class="appmark" aria-hidden="true">🏛️</div>
          <div>
            <div class="topbar-title">University Portal</div>
            <div class="topbar-sub">Secure student access</div>
          </div>
        </div>
      </header>

      <section class="card">
        <div class="section-title">Sign in</div>
        <div class="section-sub">Use your username and password to continue.</div>

        {% if locked %}
          <div class="alert alert-error" style="margin-top: 12px;">
            <strong>Account Locked 🔒</strong>
            Try again in <b id="countdown">{{ remaining_seconds }}</b> seconds.
          </div>
          <script>
            (function(){
              let s = Number("{{ remaining_seconds }}");
              const el = document.getElementById("countdown");
              const t = setInterval(() => {
                s -= 1;
                if (s <= 0) { clearInterval(t); location.reload(); return; }
                el.textContent = s;
              }, 1000);
            })();
          </script>
        {% endif %}

        {% if error %}
          <div class="alert alert-error" style="margin-top: 12px;">
            <strong>Login failed</strong>
            {{ error }}
          </div>
        {% endif %}

        <form class="form" method="POST" action="{{ url_for('login') }}">
          <div class="field">
            <label>Username</label>
            <input class="input" type="text" name="username" placeholder="e.g. abdul" required />
          </div>

          <div class="field">
            <label>Password</label>
            <input class="input" type="password" name="password" placeholder="••••••••" required />
          </div>

          <button class="btn-primary" type="submit">Login →</button>

          <div class="row" style="margin-top: 10px;">
            <a class="link" href="{{ url_for('register') }}">Create account</a>
            <a class="link" href="{{ url_for('forgot_password') }}">Forgot password?</a>
          </div>
        </form>
      </section>
    </section>

    <div class="bg-orb orb-1" aria-hidden="true"></div>
    <div class="bg-orb orb-2" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>
  </main>
</body>
</html>
