<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<main class="page">
  <section class="auth-card" style="max-width: 900px;">

    <header class="auth-header">
      <div class="logo-badge">
        {% if session.get("is_admin") %}👑{% else %}🎓{% endif %}
      </div>
      <h1>Welcome, {{ username }}</h1>
      <p>{% if session.get("is_admin") %}Administrator{% else %}Student{% endif %} Dashboard</p>
    </header>

    <div style="display:grid; gap:14px; margin-top:18px;">
      <a href="{{ url_for('files') }}" class="btn">Course Materials <span class="btn-arrow">→</span></a>
      <a href="{{ url_for('profile') }}" class="btn" style="filter: brightness(0.95);">My Profile <span class="btn-arrow">→</span></a>

      {% if session.get("is_admin") %}
        <a href="{{ url_for('admin_panel') }}" class="btn" style="filter: brightness(0.92);">Admin Panel <span class="btn-arrow">→</span></a>
      {% endif %}
    </div>

    <div style="margin-top:18px; text-align:center;">
      <a href="{{ url_for('logout') }}" class="link">Logout</a>
    </div>

  </section>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-grid"></div>
</main>

</body>
</html>
